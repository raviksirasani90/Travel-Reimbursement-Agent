name: Run prototype

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build mock finance DB
        run: python scripts/build_db.py
      - name: Run agent on sample claims
        run: python src/agent.py
      - name: Upload decision outputs
        uses: actions/upload-artifact@v4
        with:
          name: sample-decisions
          path: |
            outputs/sample_decisions.json
            outputs/workflow_trace.txt
